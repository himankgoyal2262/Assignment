<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club</title>
</head>
<body>
    <header>
        <a href="event">Event</a> |
        <a href="register page">Register</a>
    </header>
    <main>
        <h1>Coding Club</h1>
        <h2>Upcoming Events</h2>
        <table border="5">
            <caption>Club Events</caption>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
                <tr>
                    <td>HTML Workshop</td>
                    <td>12 NOv</td>
                    <td>Lab 1</td>
                </tr>
                <tr>
                    <td>Hackathon</td>
                    <td>20 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
                <tr>
                    <td colspan="3">Total events:2</td>
                </tr>
            </thead>
        </table>
        </main>

        <h2>Register</h2>
        <form action="/register">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Your name"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email"><br><br>
            
            <label for="pass">Password:</label>
            <input type="password" id="pass"><br><br>

            <label for="date">Date Of Birth:</label>
            <input type="date" id="date"><br><br>

            <label for="pn">Phone:</label>
            <input type="tel" id="pn" maxlength="10" pattern="[0-9]{10}"><br><br>

            <label for="gender">Gender:</label>
            <input type="radio" id="gender">
            <label for="male">Male</label>
            <input type="radio" id="gender">
            <label for="female">Female</label><br><br>

            <label for="it">Intersts:</label>
            <input type="checkbox" id="it">
            <label for="web">Web</label>
            <input type="checkbox" id="it">
            <label for="dsa">DSA</label><br><br>

            <label for="select">Branch:</label>
            <select name="branch" id="Branch">
                <option value="bca">BCA</option>
                <option value="b-techh">B-TECH</option>
                <option value="mca">MCA</option>
                <option value="m-tech">M-TECH</option>
            </select><br><br>

            <label for="why">Why do you want to join?</label><br>
            <textarea name="lul" id="why"></textarea><br><br>

            <button type="submit">Register</button>
        </form>
    
    
</body>
</html>
